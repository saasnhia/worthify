  <path d="M183 24 C185 16 188 10 192 4" fill="none" stroke="#00A878" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 45 C160 52 178 49 190 40" fill="none" stroke="#00A878" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="200" y="36" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="18" fill="#F1F5F9">Worthifast</text>

  <!-- Tagline -->
  <text x="158" y="60" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="10" fill="#64748B">La comptabilité intelligente pour cabinets</text>

