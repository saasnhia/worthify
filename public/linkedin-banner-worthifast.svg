  <rect x="158" y="70" width="168" height="18" rx="9" fill="#1B3A6B" fill-opacity="0.20" stroke="#1B3A6B" stroke-opacity="0.30" stroke-width="0.6"/>
  <text x="242" y="83" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="500" font-size="8.5" fill="#94A3B8">Made in France · SAS NBHC</text>

