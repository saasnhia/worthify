<svg width="1128" height="191" viewBox="0 0 1128 191" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1128" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#060C10"/>
    </linearGradient>
    <radialGradient id="glN" cx="160" cy="20" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3A6B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1B3A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glG" cx="960" cy="170" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A878" stop-opacity="0.09"/>
