    <rect x="370" y="100" width="68" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="404" y="112" text-anchor="middle" fill="#94A3B8" font-weight="500">OCR Facture</text>

    <text x="445" y="112" fill="#00A878" font-weight="600" font-size="10">→</text>

    <rect x="455" y="100" width="68" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="489" y="112" text-anchor="middle" fill="#94A3B8" font-weight="500">Journal PCG</text>

    <text x="530" y="112" fill="#00A878" font-weight="600" font-size="10">→</text>

    <rect x="540" y="100" width="54" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="567" y="112" text-anchor="middle" fill="#94A3B8" font-weight="500">TVA CA3</text>

    <text x="600" y="112" fill="#00A878" font-weight="600" font-size="10">→</text>

