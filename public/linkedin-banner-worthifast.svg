  <rect x="770" y="96" width="166" height="38" rx="6" fill="#1B3A6B" fill-opacity="0.15" stroke="#1B3A6B" stroke-opacity="0.30" stroke-width="0.6"/>
  <text x="784" y="112" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="11" fill="#7DA0CA">🧠 Agents IA custom</text>
  <text x="784" y="126" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="7.5" fill="#64748B">Créez vos agents compta</text>

  <!-- 5. RGPD natif (half right, navy) -->
  <rect x="944" y="96" width="170" height="38" rx="6" fill="#1B3A6B" fill-opacity="0.15" stroke="#1B3A6B" stroke-opacity="0.30" stroke-width="0.6"/>
  <text x="958" y="112" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="11" fill="#7DA0CA">🔒 RGPD natif</text>
  <text x="958" y="126" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="7.5" fill="#64748B">Hébergé en France</text>

  <!-- ═══ BOTTOM GREEN LINE ═══ -->
  <rect x="0" y="188" width="1128" height="3" rx="1.5" fill="#00A878" fill-opacity="0.40"/>
