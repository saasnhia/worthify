  <!-- Giant W watermark -->
  <text x="400" y="180" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="230" fill="#1B3A6B" fill-opacity="0.07" transform="rotate(-5 400 180)">W</text>

  <!-- Grid -->
  <g opacity="0.025" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="38" x2="1128" y2="38"/>
    <line x1="0" y1="76" x2="1128" y2="76"/>
    <line x1="0" y1="114" x2="1128" y2="114"/>
    <line x1="0" y1="152" x2="1128" y2="152"/>
    <line x1="188" y1="0" x2="188" y2="191"/>
    <line x1="376" y1="0" x2="376" y2="191"/>
    <line x1="564" y1="0" x2="564" y2="191"/>
    <line x1="752" y1="0" x2="752" y2="191"/>
    <line x1="940" y1="0" x2="940" y2="191"/>
  </g>

  <!-- Separators -->
