  <rect x="944" y="52" width="170" height="38" rx="6" fill="#00A878" fill-opacity="0.08" stroke="#00A878" stroke-opacity="0.30" stroke-width="0.6"/>
  <text x="958" y="68" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="11" fill="#00A878">📄 E-invoicing 2026</text>
  <text x="958" y="82" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="7.5" fill="#64748B">Factur-X EN16931 natif</text>

