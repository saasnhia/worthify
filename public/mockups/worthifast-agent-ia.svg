<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#1A1F2E"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A878" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00A878" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="aiBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0F1117" rx="8"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="500" fill="#161B22" rx="8"/>
  <rect x="180" y="0" width="1" height="500" fill="#2D333B"/>
  <circle cx="28" cy="28" r="10" fill="#00A878"/>
  <text x="44" y="33" fill="#F1F5F9" font-family="system-ui" font-size="13" font-weight="700">Worthifast</text>

  <rect x="8" y="242" width="164" height="28" fill="#00A878" fill-opacity="0.12" rx="6"/>
  <text x="36" y="260" fill="#00A878" font-family="system-ui" font-size="11" font-weight="600">Agents IA</text>

  <g font-family="system-ui" font-size="11" fill="#8B949E">
    <text x="36" y="74">Tableau de bord</text>
    <text x="36" y="104">Clients</text>
    <text x="36" y="134">Factures</text>
    <text x="36" y="164">Comptabilite</text>
    <text x="36" y="194">TVA / CA3</text>
    <text x="36" y="224">E-invoicing</text>
    <text x="36" y="290">Automatisation</text>
  </g>

  <!-- Header -->
  <text x="200" y="36" fill="#F1F5F9" font-family="system-ui" font-size="16" font-weight="700">Agent IA — Expert Comptable</text>

  <!-- Agent tabs -->
  <rect x="200" y="48" width="582" height="28" fill="#161B22" rx="6"/>
  <rect x="204" y="52" width="80" height="20" fill="#00A878" fill-opacity="0.15" rx="4"/>
  <text x="244" y="66" fill="#00A878" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">Audit</text>
  <text x="324" y="66" fill="#64748B" font-family="system-ui" font-size="9" text-anchor="middle">TVA</text>
  <text x="404" y="66" fill="#64748B" font-family="system-ui" font-size="9" text-anchor="middle">Rapprochement</text>
  <text x="484" y="66" fill="#64748B" font-family="system-ui" font-size="9" text-anchor="middle">Mail</text>
  <text x="564" y="66" fill="#64748B" font-family="system-ui" font-size="9" text-anchor="middle">PCG &amp; BOFIP</text>
  <text x="664" y="66" fill="#64748B" font-family="system-ui" font-size="9" text-anchor="middle">Mes Agents</text>

  <!-- RGPD badge -->
  <rect x="700" y="20" width="82" height="20" fill="#6366F1" fill-opacity="0.12" rx="10"/>
  <text x="741" y="34" fill="#6366F1" font-family="system-ui" font-size="8" font-weight="600" text-anchor="middle">RGPD anonymise</text>

  <!-- Chat area -->
  <rect x="200" y="84" width="582" height="360" fill="url(#cGrad)" rx="8" stroke="#2D333B" stroke-width="0.5"/>

  <!-- AI Context bar -->
  <rect x="208" y="92" width="566" height="24" fill="#1A1F2E" rx="4"/>
  <circle cx="222" cy="104" r="6" fill="#00A878" fill-opacity="0.3"/>
  <text x="222" y="107" fill="#00A878" font-family="system-ui" font-size="7" font-weight="700" text-anchor="middle">IA</text>
  <text x="234" y="108" fill="#64748B" font-family="system-ui" font-size="8">Mistral Large — France | Dossier: Cabinet Moreau | Contexte: PCG 2026</text>

  <!-- User message -->
  <rect x="380" y="128" width="386" height="48" fill="url(#userBubble)" rx="8" stroke="#00A878" stroke-opacity="0.2" stroke-width="0.5"/>
  <text x="392" y="148" fill="#F1F5F9" font-family="system-ui" font-size="10">Comment passer cette facture d'avoir du fournisseur</text>
  <text x="392" y="164" fill="#F1F5F9" font-family="system-ui" font-size="10">Lyreco ? Avoir de 480 EUR HT + TVA 20%.</text>

  <!-- User avatar -->
  <circle cx="754" cy="128" r="8" fill="#3B82F6" fill-opacity="0.3"/>
  <text x="754" y="132" fill="#3B82F6" font-family="system-ui" font-size="7" font-weight="700" text-anchor="middle">JM</text>

  <!-- AI response -->
  <circle cx="222" cy="196" r="8" fill="#00A878" fill-opacity="0.3"/>
  <text x="222" y="200" fill="#00A878" font-family="system-ui" font-size="7" font-weight="700" text-anchor="middle">IA</text>

  <rect x="208" y="192" width="460" height="218" fill="url(#aiBubble)" rx="8" stroke="#2D333B" stroke-width="0.5"/>

  <text x="240" y="212" fill="#F1F5F9" font-family="system-ui" font-size="10" font-weight="600">Voici les ecritures pour cet avoir fournisseur :</text>

  <text x="240" y="234" fill="#64748B" font-family="system-ui" font-size="9">L'avoir annule partiellement la facture initiale. Il faut</text>
  <text x="240" y="248" fill="#64748B" font-family="system-ui" font-size="9">contrepasser les ecritures d'achat au prorata.</text>

  <!-- Ecritures table -->
  <rect x="240" y="262" width="412" height="20" fill="#00A878" fill-opacity="0.08" rx="3"/>
  <text x="252" y="276" fill="#00A878" font-family="system-ui" font-size="8" font-weight="700">Compte</text>
  <text x="340" y="276" fill="#00A878" font-family="system-ui" font-size="8" font-weight="700">Libelle</text>
  <text x="520" y="276" fill="#00A878" font-family="system-ui" font-size="8" font-weight="700">Debit</text>
  <text x="590" y="276" fill="#00A878" font-family="system-ui" font-size="8" font-weight="700">Credit</text>

  <!-- Row 1 -->
  <rect x="248" y="286" width="30" height="16" fill="#00A878" fill-opacity="0.12" rx="3"/>
  <text x="263" y="298" fill="#00A878" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">401</text>
  <text x="340" y="298" fill="#F1F5F9" font-family="system-ui" font-size="9">Fournisseurs — Lyreco</text>
  <text x="520" y="298" fill="#F1F5F9" font-family="system-ui" font-size="9" font-weight="600">576,00</text>
  <text x="590" y="298" fill="#64748B" font-family="system-ui" font-size="9">—</text>

  <!-- Row 2 -->
  <rect x="248" y="308" width="46" height="16" fill="#3B82F6" fill-opacity="0.12" rx="3"/>
  <text x="271" y="320" fill="#3B82F6" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">606100</text>
  <text x="340" y="320" fill="#F1F5F9" font-family="system-ui" font-size="9">Fournitures de bureau (avoir)</text>
  <text x="520" y="320" fill="#64748B" font-family="system-ui" font-size="9">—</text>
  <text x="590" y="320" fill="#F1F5F9" font-family="system-ui" font-size="9" font-weight="600">480,00</text>

  <!-- Row 3 -->
  <rect x="248" y="330" width="46" height="16" fill="#F59E0B" fill-opacity="0.12" rx="3"/>
  <text x="271" y="342" fill="#F59E0B" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">445660</text>
  <text x="340" y="342" fill="#F1F5F9" font-family="system-ui" font-size="9">TVA deductible / ABS</text>
  <text x="520" y="342" fill="#64748B" font-family="system-ui" font-size="9">—</text>
  <text x="590" y="342" fill="#F1F5F9" font-family="system-ui" font-size="9" font-weight="600">96,00</text>

  <!-- Total row -->
  <line x1="248" y1="354" x2="640" y2="354" stroke="#2D333B" stroke-width="0.5"/>
  <text x="340" y="368" fill="#64748B" font-family="system-ui" font-size="8">Equilibre D/C</text>
  <text x="520" y="368" fill="#00A878" font-family="system-ui" font-size="9" font-weight="600">576,00</text>
  <text x="590" y="368" fill="#00A878" font-family="system-ui" font-size="9" font-weight="600">576,00</text>
  <text x="640" y="368" fill="#00A878" font-family="system-ui" font-size="8" font-weight="600">OK</text>

  <!-- Source reference -->
  <text x="240" y="394" fill="#64748B" font-family="system-ui" font-size="7">Source : PCG art. 441/4 — Regime des avoirs sur achats.</text>
  <text x="240" y="406" fill="#64748B" font-family="system-ui" font-size="7">BOFIP BOI-TVA-DED-40-10 — Regularisation TVA deductible.</text>

  <!-- CTA Button -->
  <rect x="208" y="416" width="200" height="34" fill="#00A878" rx="6"/>
  <text x="308" y="437" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Appliquer ces ecritures</text>

  <rect x="418" y="416" width="120" height="34" fill="#2D333B" rx="6" stroke="#3D444D" stroke-width="0.5"/>
  <text x="478" y="437" fill="#8B949E" font-family="system-ui" font-size="11" text-anchor="middle">Modifier avant</text>

  <!-- Input bar -->
  <rect x="200" y="454" width="582" height="36" fill="#161B22" rx="8" stroke="#2D333B" stroke-width="0.5"/>
  <text x="220" y="476" fill="#64748B" font-family="system-ui" font-size="10">Posez votre question comptable...</text>
  <rect x="730" y="460" width="44" height="24" fill="#00A878" rx="4"/>
  <text x="752" y="476" fill="#FFFFFF" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">Envoyer</text>

  <!-- Suggested questions (right side) -->
  <rect x="678" y="192" width="96" height="218" fill="url(#cGrad)" rx="6" stroke="#2D333B" stroke-width="0.5"/>
  <text x="688" y="210" fill="#64748B" font-family="system-ui" font-size="7" font-weight="600">SUGGESTIONS</text>

  <rect x="684" y="218" width="84" height="36" fill="#1A1F2E" rx="4"/>
  <text x="726" y="234" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">Verifier TVA</text>
  <text x="726" y="244" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">collectee Q1</text>

  <rect x="684" y="260" width="84" height="36" fill="#1A1F2E" rx="4"/>
  <text x="726" y="276" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">Ecart de</text>
  <text x="726" y="286" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">caisse 15 EUR</text>

  <rect x="684" y="302" width="84" height="36" fill="#1A1F2E" rx="4"/>
  <text x="726" y="318" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">Note de frais</text>
  <text x="726" y="328" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">km 0.603/km</text>

  <rect x="684" y="344" width="84" height="36" fill="#1A1F2E" rx="4"/>
  <text x="726" y="360" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">Provision</text>
  <text x="726" y="370" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">client douteux</text>

  <rect x="684" y="386" width="84" height="20" fill="#1A1F2E" rx="4"/>
  <text x="726" y="400" fill="#8B949E" font-family="system-ui" font-size="6" text-anchor="middle">+ voir tout</text>
</svg>